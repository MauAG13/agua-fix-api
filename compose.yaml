services:
  db:
    image: postgres:16-alpine
    container_name: aguafix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aguafix_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-aguafix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_USER:-mauag13docker}/agua-fix-api:latest
    container_name: aguafix_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db

volumes:
  postgres_data:
